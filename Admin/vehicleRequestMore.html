<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Vehicle Requests More</title>

    <link rel="stylesheet" href="/main.css" />
    <link rel="stylesheet" href="vehicleRequestMore.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <div class="container">
        <div class="topic">
            <p>Vehicle Request</p>
            <a href="vehicleRequests.html"><button class="cancel-btn">Back to home</button></a>
        </div>

        <form action="">
            <div class="input-box">
                <span class="details">Request ID</span>
                <input disabled type="text" class="requestID" value name="requestID" placeholder="r01-001">
            </div>
            <div class="input-box">
                <span class="details">Owner Email</span>
                <input disabled type="email" class="ownerEmail" value name="ownerEmail" placeholder="sandun@gmail.com">
            </div>
            <div class="input-box">
                <span class="details">Vehicle Number</span>
                <input disabled type="text" class="vehicleNo" value name="vehicleNo" placeholder="NB 4536">
            </div>
            <div class="input-box">
                <span class="details">Vehicle Type</span>
                <input disabled type="text" class="vehicletype" value name="vehicletype" placeholder="Van">
            </div>
            <div class="input-box">
                <span class="details">Vehicle Brand</span>
                <input disabled type="text" class="vehicleBrand" value name="vehicleBrand" placeholder="Toyota">
            </div>
            <div class="input-box">
                <span class="details">Vehicle Model</span>
                <input disabled type="text" class="vehicleModel" value name="vehicleModel" placeholder="Hiace">
            </div>
            <div class="input-box">
                <span class="details">No of Seats</span>
                <input disabled type="number" class="seatCount" value name="seatCount" placeholder="12">
            </div>
            <div class="input-box">
                <span class="details">Type of Trips</span>
                <input disabled type="text" class="tripType" value name="tripType" placeholder="Evening">
            </div>
            <div class="input-box">
                <span class="details">Starting Location</span>
                <input disabled type="text" class="startLoc" value name="startLoc" placeholder="Kalutara">
            </div>
            <div class="input-box">
                <span class="details">Ending Location</span>
                <input disabled type="text" class="endtLoc" value name="endLoc" placeholder="Colombo">
            </div>
        </form>

        <div class="photo">
            <span class="details">Photo of the Inside</span>
            <img id="inside" src="../images/trans1.jpg" alt="inside">
        </div>

        <div class="photo">
            <span class="details">Photo of the Outside</span>
            <img id="outside" src="../images/trans1.jpg" alt="outside">
        </div>

        <div class="photo">
            <span class="details">Photo of the Revenue License</span>
            <img id="rev-lic" src="../images/trans1.jpg" alt="rev-lic">
        </div>

        <div class="photo">
            <span class="details">Photo of the Vehicle Registration Document</span>
            <img id="reg-doc" src="../images/trans1.jpg" alt="reg-doc">
        </div>

        <div class="photo">
            <span class="details">Photo of the Vehicle Insurance</span>
            <img id="insurance" src="../images/trans1.jpg" alt="insurance">
        </div>
    </div>
    
    

    <script>
            var searchCriteria = "All";

        document.addEventListener("DOMContentLoaded", function() {
          var defaultOption = document.querySelector('.default_option');
          var dropdownList = document.querySelector('.dropdown ul');

          defaultOption.addEventListener('click', function() {
            dropdownList.classList.toggle('active');
          });

          var dropdownItems = document.querySelectorAll('.dropdown ul li');

          dropdownItems.forEach(function(item) {
            item.addEventListener('click', function() {
              defaultOption.textContent = item.textContent;
              dropdownList.classList.remove('active');
              searchCriteria = item.textContent.trim();
            });
          });
        });
    </script>
    <!-- <script src="./driverList.js"></script> -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {

        function getPayload(token) {
          return JSON.parse(atob(token.split(".")[1]));
      }
  
      function checkCookie(cName) {
          const name = cName + "=";
          const cDecoded = decodeURIComponent(document.cookie); //to be careful
          const cArr = cDecoded.split("; ");
          let res;
          cArr.forEach((val) => {
              if (val.indexOf(name) === 0) res = val.substring(name.length);
          });
          return res;
      }
  
      console.log(checkCookie("jwt"))
      const token = checkCookie("jwt");

      if(token == null){
        console.log("No Cookie Found");
        window.location.href = "http://127.0.0.1:5558/Admin/login.html";
      }

      const payload = getPayload(token);
      console.log("Payload",payload);

      if (payload.role === "admin") {
        console.log("Admin");
      } 
      else if (payload.role === "owner") {
        console.log("Admin");
        window.location.href = "http://127.0.0.1:5558/Owner/ownerDashboard.html";
      }
      else if (payload.role === "passenger") {
        console.log("Passenger");
        window.location.href = "http://127.0.0.1:5558/Passenger/dashboard.html";
      }
      else if (payload.role === "driver") {
        console.log("Driver");
        window.location.href = "http://127.0.0.1:5558/Driver/dashboard.html";
      }
      else {
        console.log("No Cookie Found");
        window.location.href = "http://127.0.0.1:5558/Admin/login.html";
        
      }
      });
    </script>
    
  </body>
</html>
