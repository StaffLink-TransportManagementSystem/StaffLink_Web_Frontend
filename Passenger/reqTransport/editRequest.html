<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="vehicleform.css">
        <link rel="stylesheet" href="/main.css" />

        <title>Request Edit</title>
    </head>


    <body>
        <div class="container">
            <div class="title">Change Request</div>
            <form action="#">
                <div class="vehicle-details">
                    <div class="map" id="map"></div>
                    <div class="input-box">
                        <span class="details">Request Id</span>
                        <input type="text" class="id" placeholder="Enter request id" readonly>
                        <div class="id-error-message" style="display: none; color: red;"></div>
                    </div>
                    <!-- <div class="input-box">
                        <span class="details">Vehicle No</span>
                        <input type="text" class="vehicleNo" placeholder="Enter vehicle no" readonly>
                        <div class="vehicleNo-error-message" style="display: none; color: red;"></div>
                    </div> -->
                    <div class="input-box">
                        <span class="details">Vehicle No</span>
                        <input type="text" class="vehicleNo" placeholder="Enter vehicle no" readonly>
                        <div class="vehicleNo-error-message" style="display: none; color: red;"></div>
                    </div>
                    
                    <div class="input-box">
                        <span class="details triptype">Trip type</span>
                        <select name="triptype" class="type" id="type">
                          <option class="default" selected disabled value>Select the Trip type</option>
                          <option value="Morning">Morning</option>
                          <option value="Evening">Evening</option>
                          <option value="Both">Both</option>
                        </select>
                        <div id="type-error-message" style="display: none; color: red;"></div>
                      </div>
        
                    <div class="input-box">
                        <span class="details">Amount</span>
                        <input type="text" class="amount" placeholder="Enter Amount" readonly>
                        <div class="amount-error-message" style="display: none; color: red;"></div>
                    </div>
                    
                    <div class="input-box">
                      <span class="details">Starting Date</span>
                      <input type="date" class="startingDate" placeholder="Enter starting date" required>
                      <div class="startingDate-error-message" style="display: none; color: red;"></div>
                  </div>
                  
                <div class="input-box">
                    <span class="details">Ending Date</span>
                    <input type="date" class="endingDate" placeholder="Enter ending date" required>
                    <div class="endingDate-error-message" style="display: none; color: red;"></div>
                </div>
                <div class="input-box" id="onTimeBlock">
                  <span class="details">On Time</span>
                  <input type="time" class="ontime" placeholder="Enter On Time" required>
                  <div class="ontime-error-message" style="display: none; color: red;"></div>
              </div>
              <div class="input-box" id="offTimeBlock">
                <span class="details">Off Time</span>
                <input type="time" class="offTime" placeholder="Enter Off Time" required>
                <div class="offTime-error-message" style="display: none; color: red;"></div>
            </div>
                    <div class="input-box">
                        <span class="details">Status</span>
                        <input type="text" class="tripStatus" id="status" placeholder="Enter status" readonly>
                        <div class="status-error-message" style="display: none; color: red;"></div>
                    </div>
                    <div class="input-box" style="display: none;">
                        <span class="details">Passenger Email</span>
                        <input type="text" class="passengerEmail" placeholder="Enter passenger Email" readonly>
                        <div class="passengerEmail-error-message" style="display: none; color: red;"></div>
                    </div>
                    
                    <div class="button">
                    </div>
                    
                </div>
            </form>
            <input type="submit" class="sub edit-btn" value="update" onclick="updatefunction()">
        </div>
        <script src="request.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
      
              function getPayload(token) {
                return JSON.parse(atob(token.split(".")[1]));
            }
        
            function checkCookie(cName) {
                const name = cName + "=";
                const cDecoded = decodeURIComponent(document.cookie); //to be careful
                const cArr = cDecoded.split("; ");
                let res;
                cArr.forEach((val) => {
                    if (val.indexOf(name) === 0) res = val.substring(name.length);
                });
                return res;
            }
        
            console.log(checkCookie("jwt"))
            const token = checkCookie("jwt");
      
            if(token == null){
              console.log("No Cookie Found");
              window.location.href = ".../Passenger/login-register/index.html";
            }
      
            const payload = getPayload(token);
            console.log("Payload",payload);
      
            if (payload.role === "passenger") {
              console.log("Passenger");
            } 
            else if (payload.role === "admin") {
              console.log("Admin");
              window.location.href = ".../Admin/dashboard.html";
            }
            else if (payload.role === "owner") {
              console.log("Passenger");
              window.location.href = ".../Owner/ownerDashboard.html"
            }
            else if (payload.role === "driver") {
              console.log("Driver");
              window.location.href = ".../Driver/dashboard.html";
            }
            else {
              console.log("No Cookie Found");
              window.location.href = ".../Passenger/login-register/index.html";
              
            }
            });
          </script>
          <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDgRl_dGfneZV9nL002ZSxVvcGNfVYn5b8&callback=initMap"></script>
    </body>
</html>
