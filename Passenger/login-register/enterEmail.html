        <title>Enter Email</title>

        <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">

        <script type="text/javascript">

    <body>
        <div class="container">
            <p class="topic">Verify Your Account</p>
            <p class="sub-topic">STEP 1</p>
            <p>
                Please enter the email you are registered with our application.
            </p>

            <div class="code-container">
                <input type="email" class="email" id="email" required>
            </div>

            <div class="error-message"></div>

            <div class="buttons">
                <a href="#"><button class="submit-btn" onclick="validate()">Submit</button></a>
                <a href="index.html"><button class="cancel-btn">Cancel</button></a>
            </div>
        </div>



        <script>
            function sendOTP(){
                let email = document.getElementById("email").value;
                console.log(email)
                let otp = Math.floor(Math.random() * 9000) + 1000;
                console.log(otp)

                let params;

                params = {
                    reply_to : email, 
                    otp : otp
                };

                console.log(params)

                emailjs.send("service_s4lzhbl", "template_f9p6gdd", params)
                .then(function(response) {
                    alert("Email sent! Status: " + response.status);
                    getOTP(otp, email);
                    // enterOTP();  
                })
                .catch(function(error) {
                    console.error("Error sending email:", error);
                });              
            }


            // function enterOTP(){
            //     window.location.href = "enterotp.html";
            // }
        </script>
