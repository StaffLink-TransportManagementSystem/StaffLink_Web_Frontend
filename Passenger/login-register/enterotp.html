<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="enterotp.css">
        <link rel="stylesheet" href="/main.css">

        <title>Enter OTP</title>
    </head>

    <body>
        <div class="container">
            <p class="topic">Verify Your Account</p>
            <p class="sub-topic">STEP 2</p>
            <p>
                We emailed the verification code to <b><span id="emailPlaceholder"></span></b><br>
                Enter the code below to confirm your email address.
            </p>

            <div class="code-container">
                <input type="number" class="code" id="code" min="0" max="9999" required>
            </div>

            <div class="error-message"></div>

            <div class="buttons">
                <button class="submit-btn" onclick="verifyOTP()">Verify</button>
                <a href="index.html"><button class="cancel-btn">Cancel</button></a>
            </div>

            <!-- <div>
                <button type="button" class="btn btn-primary"><a href="changepass.html">Verify</a></button>
                <button type="button" class="btn btn-cancel"><a href="profile.html">Cancel</a></button>
            </div> -->

            <!-- <small>
                If you didn't receive a code <a href="#"><strong>RESEND</strong></a>
            </small> -->
        </div>


        <script src="enterotp.js"></script>
