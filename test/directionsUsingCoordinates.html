<!DOCTYPE html>
<html>
<head>
    <title>Displaying Directions on Google Maps</title>
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Displaying Directions on Google Maps</h1>
    <div id="map"></div>
    <script>
        function initMap() {
            // Coordinates of the two locations
            var location1 = { lat: 40.7128, lng: -74.0060 }; // New York City
            var location2 = { lat: 34.0522, lng: -118.2437 }; // Los Angeles

            // Map centered at the average of the two locations
            var center = {
                lat: (location1.lat + location2.lat) / 2,
                lng: (location1.lng + location2.lng) / 2
            };

            // Create a map object and specify the DOM element for display.
            var map = new google.maps.Map(document.getElementById('map'), {
                center: center,
                zoom: 5 // Zoom level, adjust as needed
            });

            // Directions service
            var directionsService = new google.maps.DirectionsService();
            var directionsRenderer = new google.maps.DirectionsRenderer({
                map: map
            });

            // Define the request
            var request = {
                origin: location1,
                destination: location2,
                travelMode: 'DRIVING' // You can change the travel mode if needed
            };

            // Get directions
            directionsService.route(request, function(result, status) {
                if (status == 'OK') {
                    // Display the route on the map
                    directionsRenderer.setDirections(result);
                } else {
                    console.error('Error:', status);
                }
            });
        }
    </script>
    <!-- Replace "YOUR_API_KEY" with your actual Google Maps API key -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDgRl_dGfneZV9nL002ZSxVvcGNfVYn5b8
    &callback=initMap"></script>
</body>
</html>
