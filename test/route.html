<!DOCTYPE html>
<html>
<head>
    <title>Get Optimal Route</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
    <script>
        function calculateOptimalRoute() {
            var locations = [
                "New York, NY",
                "Los Angeles, CA",
                "Chicago, IL",
                // Add more locations as needed
            ];

            var waypoints = [];
            for (var i = 1; i < locations.length - 1; i++) {
                waypoints.push({ location: locations[i], stopover: true });
            }

            var origin = locations[0];
            var destination = locations[locations.length - 1];

            var request = {
                origin: origin,
                destination: destination,
                waypoints: waypoints,
                optimizeWaypoints: true,
                travelMode: 'DRIVING' // You can specify other travel modes such as 'WALKING', 'BICYCLING', or 'TRANSIT'
            };

            var directionsService = new google.maps.DirectionsService();
            var directionsRenderer = new google.maps.DirectionsRenderer();

            var map = new google.maps.Map(document.getElementById('map'), {
                zoom: 7,
                center: {lat: 41.85, lng: -87.65}  // Default center (e.g., Chicago)
            });

            directionsRenderer.setMap(map);

            directionsService.route(request, function(response, status) {
                if (status === 'OK') {
                    directionsRenderer.setDirections(response);
                } else {
                    window.alert('Directions request failed due to ' + status);
                }
            });
        }
    </script>
</head>
<body>
    <button onclick="calculateOptimalRoute()">Get Optimal Route</button>
    <div id="map" style="height: 400px;"></div>
</body>
</html>
