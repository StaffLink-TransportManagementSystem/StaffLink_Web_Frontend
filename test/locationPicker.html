<!DOCTYPE html>
<html>
<head>
    <title>Get Location Address and Coordinates with Marker</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=KEY"></script>
    <script>
        function initialize() {
            var mapOptions = {
                center: { lat: -34.397, lng: 150.644 },
                zoom: 8
            };
            var map = new google.maps.Map(document.getElementById('map-canvas'), mapOptions);
            
            var geocoder = new google.maps.Geocoder();
            var infowindow = new google.maps.InfoWindow();
            var marker = new google.maps.Marker({
                map: map,
                draggable: true
            });

            google.maps.event.addListener(map, 'click', function(event) {
                geocoder.geocode({ 'location': event.latLng }, function(results, status) {
                    if (status === 'OK') {
                        if (results[0]) {
                            var address = results[0].formatted_address; // 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA the address is in the first element of the results array
                            var coordinates = event.latLng.toString(); // (-34.49665878241656, 149.5398740234375) the coordinates are in parentheses
                            infowindow.setContent(address + '<br>' + coordinates);
                            infowindow.setPosition(event.latLng);
                            infowindow.open(map);
                            
                            // Set marker position
                            marker.setPosition(event.latLng);
                        } else {
                            window.alert('No results found');
                        }
                    } else {
                        window.alert('Geocoder failed due to: ' + status);
                    }
                });
            });
        }
        google.maps.event.addDomListener(window, 'load', initialize);
    </script>
    <style>
        #map-canvas {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map-canvas"></div>
</body>
</html>
