<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
</head>
<body>
    <h1>Upload Image</h1>
    <form id="imageUploadForm">
        <label for="emailInput">Email:</label>
        <input type="email" id="emailInput" name="emailInput" required><br><br>

        <label for="vehicleNumberInput">Vehicle Number:</label>
        <input type="text" id="vehicleNumberInput" name="vehicleNumberInput" required><br><br>

        <label for="imageFileInput">Select Image:</label>
        <input type="file" id="imageFileInput" name="imageFileInput" accept="image/*" required><br><br>

        <button type="button" onclick="uploadImage()">Upload</button>
    </form>

    <script>
        function uploadImage() {
            const email = document.getElementById('emailInput').value;
            const vehicleNumber = document.getElementById('vehicleNumberInput').value;
            const imageFileInput = document.getElementById('imageFileInput');
            const imageFile = imageFileInput.files[0];

            if (!imageFile) {
                alert('Please select an image file.');
                return;
            }

            const formData = new FormData();
            formData.append('email', email);
            formData.append('vehicleNumber', vehicleNumber);
            formData.append('image', imageFile);

            fetch('/imageUpload', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log(data.message);
                alert(data.message); // Show success message to the user
                // Optionally redirect or perform other actions
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
                alert('Image upload failed.'); // Show error message to the user
            });
        }
    </script>
</body>
</html>
