    <script>
      document.addEventListener("DOMContentLoaded", function () {

        function getPayload(token) {
          return JSON.parse(atob(token.split(".")[1]));
      }
  
      function checkCookie(cName) {
          const name = cName + "=";
          const cDecoded = decodeURIComponent(document.cookie); //to be careful
          const cArr = cDecoded.split("; ");
          let res;
          cArr.forEach((val) => {
              if (val.indexOf(name) === 0) res = val.substring(name.length);
          });
          return res;
      }
  
      console.log(checkCookie("jwt"))
      const token = checkCookie("jwt");

      if(token == null){
        console.log("No Cookie Found");
        window.location.href = "../Driver/login.html";
      }

      const payload = getPayload(token);
      console.log("Payload",payload);

      if (payload.role === "driver") {
        console.log("Driver");
      } 
      else if (payload.role === "admin") {
        console.log("Admin");
        window.location.href = "../Admin/dashboard.html";
      }
      else if (payload.role === "owner") {
        console.log("Owner");
        window.location.href = "../Owner/ownerDashboard.html"
      }
      else if (payload.role === "Passenger") {
        console.log("Driver");
        window.location.href = "../Passenger/dashboard.html";
      }
      else {
        console.log("No Cookie Found");
        window.location.href = "../Passenger/login-register/index.html";
        
      }
      });
    </script>
